name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: ./...
      - name: Lint integration tests
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --build-tags integration ./...

  generated:
    name: go.mod, mocks and sqlc code are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make tidy mocks sqlc
      - name: Fail on drift
        run: git diff --exit-code

  vulnerabilities:
    name: govulncheck (advisory, see docs/spec.md section 11.3)
    runs-on: ubuntu-latest
    # Advisory: the vulnerability database changes independently of the code, so
    # a new entry must not block unrelated pull requests. Read the log before a release.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Docker is preinstalled on ubuntu-latest; testcontainers-go starts PostgreSQL 18.
      - run: make test-integration
