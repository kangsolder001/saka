name: Frontend Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Check code style and lint
        run: pnpm lint

      - name: Check Svelte and TypeScript types
        run: pnpm check

      - name: Run unit and browser tests
        run: pnpm test

      - name: Build static SPA
        run: pnpm build

      # Drift check for OpenAPI schema types (will be active after W1.1 generates and commits schema.d.ts)
      # - name: Verify OpenAPI schema drift
      #   run: |
      #     pnpm api:generate
      #     git diff --exit-code src/lib/api/schema.d.ts
