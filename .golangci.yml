version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
