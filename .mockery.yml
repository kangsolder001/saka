# Mock generation for unit tests (`make mocks`).
# Interfaces are listed explicitly per package so only real dependency
# boundaries (repositories, Mailer, PaymentProvider, ...) get mocks.
# Add a new interface under its package, then run `make mocks`.
template: testify
dir: "{{.InterfaceDir}}/mocks"
pkgname: mocks
filename: "mock_{{.InterfaceName | snakecase}}.go"
structname: "Mock{{.InterfaceName}}"
log-level: warn
packages:
  github.com/kangsolder001/saka/internal/platform/httpx:
    interfaces:
      Pinger:
  github.com/kangsolder001/saka/internal/platform/outbox:
    interfaces:
      Queue:
      Enqueuer:
  github.com/kangsolder001/saka/internal/mail:
    interfaces:
      Mailer:
      Sender:
  github.com/kangsolder001/saka/internal/auth:
    interfaces:
      Transactor:
      UserService:
      TokenService:
      RefreshStore:
