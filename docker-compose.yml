# Local development services. PostgreSQL is published on 5433 so it does not
# clash with a PostgreSQL already listening on 5432.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: saka
      POSTGRES_PASSWORD: saka
      POSTGRES_DB: saka
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql (versioned subdir).
      - saka_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saka -d saka"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One Redis shared by every module (rate limits, caches). Not a source of
  # truth, so persistence is off. Published on 6380 to leave 6379 free for a
  # local Redis.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

volumes:
  saka_pgdata:
