openapi: 3.1.0
info:
  title: Saka API
  version: 1.0.0
  summary: Multi-tenant SaaS boilerplate (auth, users, organizations, billing, feature gating).
  description: |
    Tier 1 API reference. The source of truth for behavior is `docs/spec.md`; this file is hand-written and
    guarded by tests (`TestOpenAPI_*` in `internal/app`): every route registered by the router must appear here
    with the same method, and vice versa.

    **Authentication.** `Authorization: Bearer <access_token>` (a 15-minute JWT from `POST /auth/login`). The
    refresh token is a `refresh_token` cookie (`HttpOnly`, `SameSite=Strict`, `Path=/api/v1/auth`) for web
    clients, or is returned in the body for mobile clients (`token_delivery: body`). Role and organization are
    not in the token: they are checked against the database on every request.

    **Organizations.** All organization resources live under `/orgs/{orgId}/...`. A non-member, or an `orgId`
    that is unknown, deleted or not a UUID, always gets `404` (the existence of an organization never leaks).

    **Error format.** Every error uses `{"error": {"code", "message", "details"}}` (schema `Error`); the codes
    and their HTTP statuses are in schema `ErrorCode`. `message` is in English, meant for humans, and is not
    part of the stable contract; clients map from `code` and `details.reason`.

    **Pagination.** Lists use a cursor: `?limit=` (1-100, default 20) and `?cursor=` (opaque, taken from the
    previous response's `next_cursor`). Response: `{"items": [...], "next_cursor": "..."|null}`.

    **Rate limits.** Some endpoints are rate limited (spec §5.4); exceeding the limit returns `429 RATE_LIMITED`
    with a `Retry-After` header (seconds).

    **Response headers.** Every response carries `X-Request-ID` and `X-Trace-ID`; send `traceparent` (W3C) to
    continue a trace.

    **Time and money.** Times are RFC 3339 UTC. Money is an integer in the smallest currency unit (IDR: rupiah,
    no decimals).
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Me
  - name: Organizations
  - name: Members
  - name: Invitations
  - name: Billing
  - name: Webhooks
  - name: Health
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a new user together with their first organization (Free plan)
      description: |
        Creates the user, the organization, an `owner` membership, a `free` subscription and the verification
        email job in a single transaction. Returns no tokens: continue with `/auth/login`. If the email has a
        pending invitation, no new organization is created and the membership is granted once the email is
        verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/AuthUser' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verify an email address with the token from the link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema:
                type: object
                required: [email_verified]
                properties:
                  email_verified: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and receive an access token and a refresh token
      description: |
        An unknown email, a wrong password and a deleted/suspended user all get the same response (`401`).
        With `token_delivery: cookie` (the default) the refresh token is sent in the `refresh_token` cookie; with
        `body` it is in the response. Failed attempts are limited to 5 per 15 minutes per (email + IP).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in.
          headers:
            Set-Cookie:
              description: The `refresh_token` cookie (only when `token_delivery` = `cookie`).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Exchange a refresh token (rotation)
      description: |
        The token is read from the `refresh_token` cookie or from the body. The way the token arrives determines
        the way the new token is returned. Reusing a token that was already rotated revokes the whole session
        (`401`).
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New tokens.
          headers:
            Set-Cookie:
              description: The new `refresh_token` cookie (when the token arrived in the cookie).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the current session
      responses:
        '204': { description: Session revoked and cookie cleared. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Resend the verification email
      description: 3 per hour per user. Older unused verification tokens are invalidated.
      responses:
        '200':
          description: Email queued.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: sent }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset email
      description: Always `200` with the same message, whether or not the email is registered (prevents user enumeration). 3 per hour per email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a reset token
      description: On success, revokes all of the user's sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              additionalProperties: false
              properties:
                token: { type: string, maxLength: 256 }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Profile and the organizations the user belongs to
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                type: object
                required: [user, organizations]
                properties:
                  user: { $ref: '#/components/schemas/Profile' }
                  organizations:
                    type: array
                    items: { $ref: '#/components/schemas/OrganizationRef' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Update name or avatar
      description: "The body must not be empty. `avatar_url: null` removes the avatar. File upload is not part of Tier 1."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                avatar_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    delete:
      tags: [Me]
      operationId: deleteMe
      summary: Delete the account (soft delete)
      description: |
        Requires `current_password`. Rejected with `409` (`details.reason = owns_shared_organization`) while the
        user still owns an organization that has other members. Organizations where the user is the only member
        are deleted too and their subscriptions canceled. The email is anonymized.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmation' }
      responses:
        '204': { description: Account deleted and all sessions revoked. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/password:
    post:
      tags: [Me]
      operationId: changePassword
      summary: Change password
      description: Revokes all other sessions except the current one. A wrong current password returns `400` on `current_password`; failed attempts are limited to 5 per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              additionalProperties: false
              properties:
                current_password: { type: string, maxLength: 1024 }
                new_password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/email:
    post:
      tags: [Me]
      operationId: requestEmailChange
      summary: Request an email change (confirmation is sent to the new address)
      description: The account email does not change until the link sent to the new address is opened. 3 per hour per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, current_password]
              additionalProperties: false
              properties:
                new_email: { type: string, format: email, maxLength: 254 }
                current_password: { type: string, maxLength: 1024 }
      responses:
        '200': { $ref: '#/components/responses/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/email/confirm:
    post:
      tags: [Me]
      operationId: confirmEmailChange
      summary: Confirm the new email address with a token
      description: "No login required: the link is opened from the new inbox, possibly on another device."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Email changed and verified.
          content:
            application/json:
              schema:
                type: object
                required: [email, email_verified]
                properties:
                  email: { type: string, format: email }
                  email_verified: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/sessions:
    get:
      tags: [Me]
      operationId: listSessions
      summary: List active sessions (at most 100)
      responses:
        '200':
          description: Sessions, most recently used first.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /me/sessions/{id}:
    delete:
      tags: [Me]
      operationId: revokeSession
      summary: Revoke a single session
      description: An ID that belongs to another user, does not exist, has already ended or is not a UUID always returns `404`. Revoking the current session logs out.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orgs:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: The user's organizations (paginated)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page, oldest membership first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MemberOrganization' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Create a new organization (the caller becomes owner)
      description: Starts on a Free subscription. 10 per hour per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 200 }
                slug: { $ref: '#/components/schemas/Slug' }
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /orgs/{orgId}:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Organization details (all members)
      responses:
        '200':
          description: The organization with the caller's role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      summary: Update name, slug or logo (owner and admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, maxLength: 200 }
                slug: { $ref: '#/components/schemas/Slug' }
                logo_url: { type: [string, 'null'], format: uri, description: '`null` removes the logo; absolute http(s) URLs only.' }
      responses:
        '200':
          description: Updated organization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Organizations]
      operationId: deleteOrganization
      summary: Delete the organization (owner; soft delete)
      description: Members lose access immediately; open invitations are revoked, the subscription is canceled and open invoices are voided in the same transaction.
      responses:
        '204': { description: Organization deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orgs/{orgId}/members:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
    get:
      tags: [Members]
      operationId: listMembers
      summary: List members (paginated; all members)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of members, owner first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orgs/{orgId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [Members]
      operationId: changeMemberRole
      summary: Change a member's role (permission matrix in spec §7.2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { type: string, enum: [admin, member], description: '`owner` is rejected with `400`; ownership moves via transfer-ownership.' }
      responses:
        '200':
          description: Updated member.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member
      responses:
        '204': { description: Member removed. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orgs/{orgId}/leave:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
    post:
      tags: [Members]
      operationId: leaveOrganization
      summary: Leave the organization
      description: The owner gets `403` (`details.reason = owner_must_transfer_ownership`).
      responses:
        '204': { description: The caller is no longer a member. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orgs/{orgId}/transfer-ownership:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
    post:
      tags: [Members]
      operationId: transferOwnership
      summary: Transfer ownership (owner; atomic, requires password)
      description: The target becomes `owner` and the previous owner becomes `admin`. Targeting yourself returns `400`; a non-member target returns `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, current_password]
              additionalProperties: false
              properties:
                user_id: { type: string, format: uuid }
                current_password: { type: string, maxLength: 1024 }
      responses:
        '204': { description: Ownership transferred. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /orgs/{orgId}/invitations:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
    get:
      tags: [Invitations]
      operationId: listInvitations
      summary: Active invitations (owner and admin; paginated)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Invitations that are open and not expired.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: Invite by email (owner and admin; the inviter must be verified)
      description: |
        Inviting an email that already has an open invitation refreshes that invitation (`200`; new token, 7
        days). Counts against the `members` limit (members + active invitations): exceeding it returns
        `402 PLAN_LIMIT_REACHED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role: { type: string, enum: [admin, member] }
      responses:
        '200':
          description: Open invitation refreshed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationEnvelope' }
        '201':
          description: New invitation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationEnvelope' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PlanLimitReached' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orgs/{orgId}/invitations/{id}:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { $ref: '#/components/parameters/Id' }
    delete:
      tags: [Invitations]
      operationId: revokeInvitation
      summary: Revoke an invitation
      responses:
        '204': { description: The invitation link no longer works. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orgs/{orgId}/invitations/{id}/resend:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Invitations]
      operationId: resendInvitation
      summary: Resend an invitation (new token and expiry)
      description: Resending an expired invitation takes up a seat again (`members` limit).
      responses:
        '200':
          description: Invitation refreshed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '402': { $ref: '#/components/responses/PlanLimitReached' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invitations/{token}:
    get:
      tags: [Invitations]
      operationId: getInvitation
      summary: Invitation details by link token (public)
      description: |
        A link that is no longer valid returns `404` with `details.reason` (`expired`, `revoked`, `accepted`,
        `declined`, `organization_deleted`); an unknown token returns `404` without a reason.
      security: []
      parameters:
        - { $ref: '#/components/parameters/InvitationToken' }
      responses:
        '200':
          description: Invitation details.
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation: { $ref: '#/components/schemas/InvitationInfo' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /invitations/{token}/accept:
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Accept an invitation (logged in with a verified email; the email must match the invitation)
      description: A different email returns `403` (`details.reason = invitation_email_mismatch`) and the invitation stays unused.
      parameters:
        - { $ref: '#/components/parameters/InvitationToken' }
      responses:
        '200':
          description: The caller is now a member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /invitations/{token}/decline:
    post:
      tags: [Invitations]
      operationId: declineInvitation
      summary: Decline an invitation (public)
      security: []
      parameters:
        - { $ref: '#/components/parameters/InvitationToken' }
      responses:
        '204': { description: Invitation declined. }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /plans:
    get:
      tags: [Billing]
      operationId: listPlans
      summary: Catalog of active plans (public)
      security: []
      responses:
        '200':
          description: Plans ordered by `sort_order`.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Plan' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /orgs/{orgId}/subscription:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
    get:
      tags: [Billing]
      operationId: getSubscription
      summary: Subscription status and usage against limits (all members)
      responses:
        '200':
          description: Subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orgs/{orgId}/subscription/checkout:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
    post:
      tags: [Billing]
      operationId: checkout
      summary: Create an invoice and payment link for a plan (owner, verified email)
      description: |
        Amount and period always come from the `plans` table. A Free organization that has never had a trial
        gets a trial of a plan with `trial_days` (`trial_started: true`) without payment. Idempotent: calling
        again for the same plan returns the invoice that can still be paid (`200`). A gateway failure returns
        `502` and nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRequest' }
      responses:
        '200':
          description: The still-payable invoice for the same plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '201':
          description: New invoice.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/PaymentProviderError' }
  /orgs/{orgId}/subscription/change-plan:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
    post:
      tags: [Billing]
      operationId: changePlan
      summary: Upgrade through an invoice; downgrade is scheduled for the end of the period (owner)
      description: |
        Upgrade: like checkout (an invoice; the plan changes once it is paid). Downgrade: recorded in
        `pending_plan` (`scheduled: true`) with `warnings` for limits that would be exceeded. Requesting the
        current plan cancels a scheduled downgrade (`cleared: true`). `expired`/`canceled`: `409`
        (`details.reason = use_checkout`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanRequest' }
      responses:
        '200':
          description: Change scheduled or canceled, or the existing invoice returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePlanResponse' }
        '201':
          description: New invoice for the upgrade.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePlanResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/PaymentProviderError' }
  /orgs/{orgId}/subscription/cancel:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
    post:
      tags: [Billing]
      operationId: cancelSubscription
      summary: Cancel at the end of the period (owner; idempotent)
      description: Access continues until the period ends; no refund.
      responses:
        '200':
          description: The subscription with `cancel_at_period_end = true`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orgs/{orgId}/subscription/resume:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
    post:
      tags: [Billing]
      operationId: resumeSubscription
      summary: Undo a pending cancellation (owner; idempotent)
      responses:
        '200':
          description: The subscription with `cancel_at_period_end = false`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /orgs/{orgId}/invoices:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
    get:
      tags: [Billing]
      operationId: listInvoices
      summary: Invoice history (owner; paginated, newest first)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of invoices.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orgs/{orgId}/invoices/{id}:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Billing]
      operationId: getInvoice
      summary: Invoice details (owner)
      description: Another organization's invoice returns `404`. `payment_url` holds a link only while the invoice is `open`.
      responses:
        '200':
          description: Invoice.
          content:
            application/json:
              schema:
                type: object
                required: [invoice]
                properties:
                  invoice: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks/{provider}:
    post:
      tags: [Webhooks]
      operationId: paymentWebhook
      summary: Payment notification from the gateway (public; the signature is the credential)
      description: |
        The signature is verified by the gateway code before anything else (`401` when invalid; nothing is
        stored). The body is at most 1 MiB; an unregistered provider returns `404`. Events are processed
        idempotently (`UNIQUE(provider, event_id)`); redeliveries get `200`. A processing failure returns `500`
        so the gateway redelivers. 600 per minute per IP. The body format and signature header are defined by
        the gateway (Midtrans: JSON with `signature_key`).
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, examples: [midtrans, fake] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Accepted (also for redeliveries).
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /healthz:
    get:
      tags: [Health]
      operationId: healthz
      summary: Liveness (outside /api/v1)
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /readyz:
    get:
      tags: [Health]
      operationId: readyz
      summary: "Readiness: checks PostgreSQL and Redis (outside /api/v1)"
      security: []
      servers:
        - url: /
      responses:
        '200':
          description: All dependencies are healthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: A dependency is down (the cause is only in the logs).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /auth/login` or `/auth/refresh`. An expired token returns `401 TOKEN_EXPIRED`.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: Organization ID (UUID). A non-member or unknown ID returns `404`.
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationToken:
      name: token
      in: path
      required: true
      description: The raw token from the invitation email link.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` value from the previous page (opaque).
      schema: { type: string }
  responses:
    Message:
      description: Confirmation message.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
    ValidationError:
      description: "`400 VALIDATION_ERROR`; `details` maps fields to messages."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: "`401 UNAUTHENTICATED` or `TOKEN_EXPIRED`."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PlanLimitReached:
      description: "`402 PLAN_LIMIT_REACHED`; `details`: `limit`, `max`, `used`, `plan`, `upgrade_to`."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: "`403 FORBIDDEN`, `EMAIL_NOT_VERIFIED` or `PLAN_FEATURE_UNAVAILABLE`."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: "`404 NOT_FOUND` (also for non-members of the organization)."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: "`409 CONFLICT`; `details.reason` names the cause when there is one."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: "`429 RATE_LIMITED`."
      headers:
        Retry-After:
          description: Seconds until a retry is allowed.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PaymentProviderError:
      description: "`502 PAYMENT_PROVIDER_ERROR`: the gateway is unreachable or rejected the request; nothing is stored and it is safe to retry."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: "`500 INTERNAL_ERROR`: generic message; the cause is only in the logs."
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
              description: Depends on the code; e.g. a map of fields to messages for `VALIDATION_ERROR`, `retry_after_seconds` for `RATE_LIMITED`.
    ErrorCode:
      type: string
      description: |
        Stable codes and their HTTP statuses: `VALIDATION_ERROR` 400; `UNAUTHENTICATED` 401; `TOKEN_EXPIRED` 401;
        `FORBIDDEN` 403; `EMAIL_NOT_VERIFIED` 403; `PLAN_FEATURE_UNAVAILABLE` 403; `PLAN_LIMIT_REACHED` 402;
        `SUBSCRIPTION_INACTIVE` 402; `NOT_FOUND` 404; `CONFLICT` 409; `RATE_LIMITED` 429;
        `PAYMENT_PROVIDER_ERROR` 502; `INTERNAL_ERROR` 500.
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - FORBIDDEN
        - EMAIL_NOT_VERIFIED
        - PLAN_FEATURE_UNAVAILABLE
        - PLAN_LIMIT_REACHED
        - SUBSCRIPTION_INACTIVE
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - PAYMENT_PROVIDER_ERROR
        - INTERNAL_ERROR
    Page:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: {} }
        next_cursor: { type: [string, 'null'], description: '`null` on the last page.' }
    Slug:
      type: string
      minLength: 3
      maxLength: 48
      description: Lowercase letters, digits and single hyphens; unique, case-insensitive. Left empty on creation, it is derived from the name.
    RegisterRequest:
      type: object
      required: [email, password, name, organization_name]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72, description: Must not equal the email. }
        name: { type: string, maxLength: 100 }
        organization_name: { type: string, maxLength: 100 }
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, maxLength: 256 }
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, maxLength: 1024 }
        token_delivery: { type: string, enum: [cookie, body], default: cookie }
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token: { type: string, maxLength: 256 }
    PasswordConfirmation:
      type: object
      required: [current_password]
      additionalProperties: false
      properties:
        current_password: { type: string, maxLength: 1024 }
    AuthUser:
      type: object
      required: [id, email, name, email_verified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        email_verified: { type: boolean }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Seconds. }
        refresh_token: { type: string, description: Only when the token is delivered in the body. }
        user: { $ref: '#/components/schemas/AuthUser' }
    Profile:
      type: object
      required: [id, email, name, avatar_url, email_verified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        avatar_url: { type: [string, 'null'] }
        email_verified: { type: boolean }
    OrganizationRef:
      type: object
      required: [id, name, slug, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Role:
      type: string
      enum: [owner, admin, member]
    Session:
      type: object
      required: [id, user_agent, ip, created_at, last_used_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean, description: The session that made this request. }
    Organization:
      type: object
      required: [id, name, slug, logo_url, owner_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        logo_url: { type: [string, 'null'] }
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MemberOrganization:
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          required: [role]
          properties:
            role: { $ref: '#/components/schemas/Role' }
    OrganizationEnvelope:
      type: object
      required: [organization]
      properties:
        organization: { $ref: '#/components/schemas/MemberOrganization' }
    Member:
      type: object
      required: [user_id, email, name, avatar_url, role, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        avatar_url: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
        joined_at: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, email, role, invited_by, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member] }
        invited_by: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    InvitationEnvelope:
      type: object
      required: [invitation]
      properties:
        invitation: { $ref: '#/components/schemas/Invitation' }
    InvitationInfo:
      type: object
      required: [email, role, organization, inviter_name, expires_at, account_exists]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member] }
        organization:
          type: object
          required: [name, logo_url]
          properties:
            name: { type: string }
            logo_url: { type: [string, 'null'] }
        inviter_name: { type: string }
        expires_at: { type: string, format: date-time }
        account_exists: { type: boolean, description: Lets the frontend choose between login and registration. }
    Plan:
      type: object
      required: [code, name, price_amount, currency, interval, trial_days, features, limits]
      properties:
        code: { type: string, examples: [free, pro, business] }
        name: { type: string }
        price_amount: { type: integer, format: int64, description: Smallest currency unit (rupiah). }
        currency: { type: string, examples: [IDR] }
        interval: { type: string, enum: [month, year] }
        trial_days: { type: integer }
        features: { type: array, items: { type: string } }
        limits:
          type: object
          additionalProperties: { type: integer }
          description: '`-1` = unlimited.'
    LimitUsage:
      type: object
      required: [used, max]
      properties:
        used: { type: integer }
        max: { type: integer, description: '`-1` = unlimited.' }
    SubscriptionStatus:
      type: string
      enum: [trialing, active, past_due, expired, canceled]
    Subscription:
      type: object
      required: [plan, status, trial_ends_at, current_period_start, current_period_end, cancel_at_period_end, pending_plan, grace_until, effective_plan, usage]
      properties:
        plan: { type: string, description: The code of the subscription's own plan. }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        trial_ends_at: { type: [string, 'null'], format: date-time }
        current_period_start: { type: string, format: date-time }
        current_period_end: { type: [string, 'null'], format: date-time, description: '`null` for Free.' }
        cancel_at_period_end: { type: boolean }
        pending_plan: { type: [string, 'null'], description: Scheduled downgrade. }
        grace_until: { type: [string, 'null'], format: date-time }
        effective_plan: { type: string, description: The plan currently in effect; `free` once access has ended. }
        usage:
          type: object
          additionalProperties: { $ref: '#/components/schemas/LimitUsage' }
    SubscriptionEnvelope:
      type: object
      required: [subscription]
      properties:
        subscription: { $ref: '#/components/schemas/Subscription' }
    PlanRequest:
      type: object
      required: [plan]
      additionalProperties: false
      properties:
        plan: { type: string, maxLength: 64, description: Plan code. The amount never comes from the client. }
    Invoice:
      type: object
      required: [id, number, kind, plan, plan_name, amount, currency, status, period_start, period_end, due_at, paid_at, payment_url, created_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: [INV-2026-000123], description: Globally unique number. }
        kind: { type: string, enum: [checkout, renewal] }
        plan: { type: string }
        plan_name: { type: string }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string, enum: [draft, open, paid, expired, void] }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        due_at: { type: string, format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        payment_url: { type: [string, 'null'], description: Payment link; `null` when the invoice can no longer be paid. }
        created_at: { type: string, format: date-time }
    CheckoutResponse:
      type: object
      required: [invoice, subscription, trial_started]
      properties:
        invoice: { $ref: '#/components/schemas/Invoice' }
        subscription: { $ref: '#/components/schemas/Subscription' }
        trial_started: { type: boolean }
    ChangePlanResponse:
      type: object
      required: [subscription, invoice, scheduled, cleared, trial_started, warnings]
      properties:
        subscription: { $ref: '#/components/schemas/Subscription' }
        invoice:
          oneOf:
            - $ref: '#/components/schemas/Invoice'
            - type: 'null'
        scheduled: { type: boolean, description: Downgrade scheduled for the end of the period. }
        cleared: { type: boolean, description: Scheduled downgrade canceled. }
        trial_started: { type: boolean }
        warnings:
          type: array
          items:
            type: object
            required: [limit, used, max]
            properties:
              limit: { type: string }
              used: { type: integer }
              max: { type: integer }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, down] }
