# sqlc generates type-safe Go from SQL (`make sqlc`).
# Schema comes from the goose migrations (sqlc ignores the Down sections).
# Each module owns its queries and generated package; add one entry per module
# as its tables are introduced, for example:
#
#   - engine: postgresql
#     schema: migrations
#     queries: internal/user/queries
#     gen:
#       go:
#         package: userdb
#         out: internal/user/userdb
#         sql_package: pgx/v5
#         emit_pointers_for_null_types: true
#         overrides:
#           - db_type: uuid
#             go_type: github.com/google/uuid.UUID
#           - db_type: timestamptz
#             go_type: time.Time
#           - db_type: timestamptz
#             nullable: true
#             go_type: { import: time, type: Time, pointer: true }
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/platform/outbox/queries
    gen:
      go:
        package: outboxdb
        out: internal/platform/outbox/outboxdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        # Only emit structs the queries use, so one module's package never
        # carries another module's table models.
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: { import: github.com/google/uuid, type: UUID, pointer: true }
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
  - engine: postgresql
    schema: migrations
    queries: internal/user/queries
    gen:
      go:
        package: userdb
        out: internal/user/userdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: { import: github.com/google/uuid, type: UUID, pointer: true }
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
  - engine: postgresql
    schema: migrations
    queries: internal/auth/queries
    gen:
      go:
        package: authdb
        out: internal/auth/authdb
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: { import: github.com/google/uuid, type: UUID, pointer: true }
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: { import: time, type: Time, pointer: true }
